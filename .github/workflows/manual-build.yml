name: Manual Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 測試 + 組 debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: 準備 APK 檔案名稱與產物
        id: meta
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="ohmybias-v${VERSION}-debug-${SHORT_SHA}.apk"
          cp "$APK_SRC" "$APK_NAME"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: 上傳 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.meta.outputs.apk_name }}
          retention-days: 7
